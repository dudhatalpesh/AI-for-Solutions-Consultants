name: Validate repository

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON, n8n workflow structure, links and secret patterns
        run: python scripts/validate_repo.py
      - name: Run unit tests (no services required)
        run: |
          pip install pytest
          python -m pytest -q labs/lab-10-secure-rag-with-guardrails
      - name: Check Python files compile
        run: python -m compileall -q labs scripts
